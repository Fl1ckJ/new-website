# SteelTrace — steeltrace.co -> steeltrace.ai migration redirects
#
# Goes on the server that answers steeltrace.co. Every rule 301s straight to the
# FINAL steeltrace.ai URL, so crawlers see a single hop (no redirect chains).
#
# Why not just `location / { return 301 https://steeltrace.ai$request_uri; }`:
#   - old URLs all end in "/", and the .ai config's try_files 404s on /careers/
#   - blog posts moved from /blog/<slug>/ to /post?slug=<slug>
#   - 16 post slugs were renamed during the Notion migration
#
# Deploy: /etc/nginx/sites-available/steeltrace.co -> symlink into sites-enabled/
#         nginx -t && systemctl reload nginx

# ---------------------------------------------------------------------------
# 1) extract the post slug from /blog/<slug>/   (empty for /blog/, /blog/page/2/)
# ---------------------------------------------------------------------------
map $uri $st_old_slug {
    default              "";
    ~^/blog/([^/]+)/?$   $1;
}

# ---------------------------------------------------------------------------
# 2) old slug -> new slug. Unlisted slugs pass through unchanged (42 of them).
# ---------------------------------------------------------------------------
map $st_old_slug $st_new_slug {
    default  $st_old_slug;

    5-ways-to-find-out-if-an-mtc-is-fake
        5-ways-to-find-out-if-an-mtc-material-test-certificate-is-fake;
    6-to-look-for-ndt-reports
        6-things-to-look-for-on-non-destructive-testing-ndt-reports;
    6-ways-reduce-carbon-footprint
        6-innovative-ways-to-reduce-your-company-s-carbon-footprint;
    brazilian-petroleum-partnerships
        steeltrace-partners-with-the-brazilian-petroleum-partnerships-bpp-program;
    cradle-to-grave-traceability-part-4-reduction-of-insurance-costs
        reduction-of-insurance-costs;
    digital-trail
        why-a-secured-digital-trail-can-add-value;
    is-your-lab-ndt-department-ready-for-your-customers-digital-transformation
        is-your-lab-ndt-department-ready-for-your-customer-s-digital-transformation;
    leave-a-better-legacy-for-future-engineers-cradle-to-grave-traceability-part-1
        leave-a-better-legacy-for-future-engineers;
    life-extension-of-assets-in-the-oil-and-gas-industry-cradle-to-grave-traceability-part-3
        life-extension-of-assets-in-the-oil-and-gas-industry;
    maintain-data-integrity
        how-do-you-maintain-the-integrity-of-your-data-when-it-leaves-the-premises;
    quality4_opportunities
        quality-4-0-opportunities-in-the-steel-supply-chain;
    smart-things-maintenance-in-the-oil-and-gas-industry
        smart-things;
    steeltrace-update-biometrics
        biometrics-login-and-signing;
    traceability-improves-recyclability-reduction-of-carbon-footprint
        traceability-improves-recyclability;
    webinar-steeltrace-blockchain-in-oilgas-qa
        webinar-steeltrace-blockchain-in-oil-gas-q-a;
    webinar-webinar-saving-costs-whilst-gaining-control-in-the-supply-chain
        webinar-saving-costs-while-gaining-control-of-the-supply-chain;
}

server {
    listen 443 ssl http2;
    server_name steeltrace.co www.steeltrace.co;

    # ssl_certificate     /etc/letsencrypt/live/steeltrace.co/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/steeltrace.co/privkey.pem;

    # ---- renamed pages (exact matches, checked before the prefix rules) ----
    location = /about-us/          { return 301 https://steeltrace.ai/about; }
    location = /how-does-it-work/  { return 301 https://steeltrace.ai/how-it-works; }
    location = /how-it-works/      { return 301 https://steeltrace.ai/how-it-works; }
    location = /privacy/           { return 301 https://steeltrace.ai/privacy-policy; }
    location = /privacy-policy/    { return 301 https://steeltrace.ai/privacy-policy; }
    location = /weekly/            { return 301 https://steeltrace.ai/demo; }
    location = /blog/              { return 301 https://steeltrace.ai/blog; }

    # ---- retired Hugo taxonomy pages -> blog index ----
    location /categories/ { return 301 https://steeltrace.ai/blog; }
    location /tags/       { return 301 https://steeltrace.ai/blog; }

    # ---- solutions: the six material pages have no 1:1 counterpart ----
    # DECISION NEEDED: these currently all land on the solutions overview.
    # Replace with per-material targets if you have better matches.
    location = /solutions/ { return 301 https://steeltrace.ai/solution; }
    location /solutions/   { return 301 https://steeltrace.ai/solution; }

    # ---- blog posts: /blog/<slug>/ -> /post?slug=<new-slug> ----
    # The replacement contains "?", so nginx does NOT append the original
    # query string — no risk of a doubled ?slug=.
    location /blog/ {
        if ($st_new_slug) {
            return 301 https://steeltrace.ai/post?slug=$st_new_slug;
        }
        # /blog/page/2/ and anything else unrecognised
        return 301 https://steeltrace.ai/blog;
    }

    # ---- everything else: same path, minus any trailing slash ----
    location / {
        rewrite ^/(.*)/$  https://steeltrace.ai/$1  permanent;
        return 301 https://steeltrace.ai$request_uri;
    }
}

# http -> https, straight to the new domain
server {
    listen 80;
    server_name steeltrace.co www.steeltrace.co;
    return 301 https://steeltrace.ai$request_uri;
}
